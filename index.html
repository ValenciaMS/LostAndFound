<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e07a1f'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l7 7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Lost &amp; Found</title>
    <meta name="description" content="Lost property gallery of the school, organised by category." />
  </head>
  <body>
    <header class="top">
      <h1 id="title">Lost &amp; Found</h1>
      <div class="tools">
        <input id="search" type="search" />
        <div class="lang" role="group" aria-label="Language / Idioma">
          <button id="langEn" type="button" lang="en">EN</button>
          <button id="langEs" type="button" lang="es">ES</button>
        </div>
      </div>
    </header>
    <p class="updated" role="status">
      <span id="updated"></span>
      <button id="btnCheck" type="button" class="check"></button>
      <span id="checkMsg"></span>
    </p>
    <nav id="cats" class="cats"></nav>
    <p id="count" class="count" role="status"></p>
    <main id="grid" class="grid"></main>

    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true">
      <button id="lbClose" class="lb-btn lb-close">✕</button>
      <button id="lbPrev" class="lb-btn lb-prev">‹</button>
      <figure>
        <img id="lbImg" alt="" />
        <figcaption><span id="lbCap"></span> <a id="lbOpen" target="_blank" rel="noopener"></a></figcaption>
      </figure>
      <button id="lbNext" class="lb-btn lb-next">›</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
